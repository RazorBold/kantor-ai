<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== ENGINE ============================== */
try { await Promise.race([document.fonts.load('italic 800 100px "Plus Jakarta Sans"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const BG_DAY = new THREE.Color('#0f1b2d'), BG_NIGHT = new THREE.Color('#060a12');
scene.background = BG_DAY.clone();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 300);
const CAM_HOME = new THREE.Vector3(27, 24, 30), TARGET_HOME = new THREE.Vector3(0, -0.6, 0.5);
camera.position.copy(CAM_HOME);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET_HOME);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 8; controls.maxDistance = 70; controls.maxPolarAngle = Math.PI * 0.47;

const hemi = new THREE.HemisphereLight('#dfe9ff', '#3b3226', 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3df', 2.2);
sun.position.set(14, 24, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 16, bottom: -16, near: 1, far: 70 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ============================== UTIL ============================== */
let seed = 1337;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rnd();
const lamps = []; // emissive things that glow at night
const screens = [];

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv;
  parent.add(m); return m;
}
const rbox = (w, h, d, r = 0.02, s = 3) => new RoundedBoxGeometry(w, h, d, s, Math.min(r, w / 2, h / 2, d / 2));

/* ======================= PROCEDURAL PBR TEXTURES ======================= */
// Each set = colour map + roughness map + bump (height) map drawn on canvases.
function pbrSet(size, draw, repeat = [1, 1]) {
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = size; return c; };
  const col = mk(), hgt = mk(), rgh = mk();
  draw(col.getContext('2d'), hgt.getContext('2d'), rgh.getContext('2d'), size);
  const tex = (c, srgb) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  return { map: tex(col, true), bumpMap: tex(hgt, false), roughnessMap: tex(rgh, false) };
}
function noise(ctx, s, n, rMin, rMax, colorFn) {
  for (let i = 0; i < n; i++) { ctx.fillStyle = colorFn(); ctx.beginPath(); ctx.arc(rnd() * s, rnd() * s, R(rMin, rMax), 0, 7); ctx.fill(); }
}
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

function woodPlanks(baseH, baseS, baseL, planks = 6, repeat = [4, 4]) {
  return pbrSet(1024, (c, h, r, s) => {
    h.fillStyle = '#808080'; h.fillRect(0, 0, s, s); r.fillStyle = '#7a7a7a'; r.fillRect(0, 0, s, s);
    const pw = s / planks;
    for (let i = 0; i < planks; i++) {
      let y = -R(0, s * 0.6);
      while (y < s) {
        const len = R(s * 0.35, s * 0.8), L = baseL + R(-6, 6), Hh = baseH + R(-4, 4);
        c.fillStyle = hsl(Hh, baseS + R(-6, 6), L); c.fillRect(i * pw, y, pw, len);
        for (let g = 0; g < 26; g++) { // grain
          c.strokeStyle = hsl(Hh, baseS, L - R(4, 14), R(0.08, 0.25)); c.lineWidth = R(0.6, 2.2);
          const gx = i * pw + R(2, pw - 2); c.beginPath(); c.moveTo(gx, y);
          for (let k = 0; k <= 8; k++) c.lineTo(gx + Math.sin(k * 0.9 + g) * R(0.5, 3), y + len * k / 8); c.stroke();
          h.strokeStyle = `rgba(150,150,150,${R(.1, .3)})`; h.lineWidth = 1; h.beginPath(); h.moveTo(gx, y); h.lineTo(gx + R(-2, 2), y + len); h.stroke();
        }
        if (rnd() < 0.25) { const kx = i * pw + R(8, pw - 8), ky = y + R(10, len - 10); c.fillStyle = hsl(Hh - 4, baseS, L - 16, .6);
          c.beginPath(); c.ellipse(kx, ky, R(3, 7), R(6, 12), 0, 0, 7); c.fill(); }
        r.fillStyle = `rgb(${R(95, 140)|0},0,0)`.replace(/rgb\((\d+),0,0\)/, (m, v) => `rgb(${v},${v},${v})`); r.fillRect(i * pw, y, pw, len);
        h.fillStyle = '#2a2a2a'; h.fillRect(i * pw, y, pw, 3); c.fillStyle = hsl(Hh, baseS, L - 22, .7); c.fillRect(i * pw, y, pw, 2);
        y += len;
      }
      h.fillStyle = '#202020'; h.fillRect(i * pw, 0, 3, s); c.fillStyle = 'rgba(30,18,8,.55)'; c.fillRect(i * pw, 0, 2, s);
    }
  }, repeat);
}
function concrete(l = 72, repeat = [6, 6]) {
  return pbrSet(1024, (c, h, r, s) => {
    c.fillStyle = hsl(210, 6, l); c.fillRect(0, 0, s, s); h.fillStyle = '#808080'; h.fillRect(0, 0, s, s); r.fillStyle = '#b0b0b0'; r.fillRect(0, 0, s, s);
    noise(c, s, 9000, .5, 2.2, () => hsl(210, 5, l + R(-12, 10), R(.1, .35)));
    noise(c, s, 260, 10, 60, () => hsl(30, 8, l + R(-8, 6), .05));
    noise(h, s, 7000, .5, 2, () => `rgba(${rnd() < .5 ? 40 : 210},${rnd() < .5 ? 40 : 210},${rnd() < .5 ? 40 : 210},.25)`);
    noise(r, s, 400, 8, 50, () => `rgba(${R(120, 220)|0},${R(120, 220)|0},${R(120, 220)|0},.15)`);
  }, repeat);
}
function carpet(hue, sat, l, repeat = [5, 5]) {
  return pbrSet(512, (c, h, r, s) => {
    c.fillStyle = hsl(hue, sat, l); c.fillRect(0, 0, s, s); h.fillStyle = '#808080'; h.fillRect(0, 0, s, s); r.fillStyle = '#e6e6e6'; r.fillRect(0, 0, s, s);
    noise(c, s, 22000, .4, 1.2, () => hsl(hue, sat, l + R(-9, 9), .6));
    noise(h, s, 20000, .4, 1.1, () => `rgba(${rnd() < .5 ? 20 : 235},${rnd() < .5 ? 20 : 235},${rnd() < .5 ? 20 : 235},.5)`);
    c.strokeStyle = hsl(hue, sat, l - 6, .5); c.lineWidth = 2; c.strokeRect(1, 1, s - 2, s - 2); // carpet tile seams
    h.strokeStyle = '#303030'; h.lineWidth = 3; h.strokeRect(1, 1, s - 2, s - 2);
  }, repeat);
}
function fabric(hue, sat, l, repeat = [3, 3]) {
  return pbrSet(256, (c, h, r, s) => {
    c.fillStyle = hsl(hue, sat, l); c.fillRect(0, 0, s, s); h.fillStyle = '#808080'; h.fillRect(0, 0, s, s); r.fillStyle = '#efefef'; r.fillRect(0, 0, s, s);
    for (let i = 0; i < s; i += 2) {
      c.fillStyle = hsl(hue, sat, l + (i % 4 ? 4 : -4), .5); c.fillRect(0, i, s, 1); c.fillRect(i, 0, 1, s);
      h.fillStyle = i % 4 ? 'rgba(220,220,220,.5)' : 'rgba(40,40,40,.5)'; h.fillRect(0, i, s, 1); h.fillRect(i, 0, 1, s);
    }
    noise(c, s, 1500, .3, .9, () => hsl(hue, sat, l + R(-10, 10), .4));
  }, repeat);
}
function tiles(repeat = [4, 4]) {
  return pbrSet(512, (c, h, r, s) => {
    const n = 4, t = s / n; h.fillStyle = '#202020'; h.fillRect(0, 0, s, s); r.fillStyle = '#555'; r.fillRect(0, 0, s, s);
    c.fillStyle = '#c9c6bf'; c.fillRect(0, 0, s, s);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      c.fillStyle = hsl(40, 6, R(86, 92)); c.fillRect(i * t + 3, j * t + 3, t - 6, t - 6);
      h.fillStyle = '#a0a0a0'; h.fillRect(i * t + 3, j * t + 3, t - 6, t - 6);
      r.fillStyle = `rgb(${R(40, 70)|0},${R(40, 70)|0},${R(40, 70)|0})`; r.fillRect(i * t + 3, j * t + 3, t - 6, t - 6);
    }
    noise(c, s, 1500, .4, 1.4, () => hsl(40, 5, R(70, 95), .3));
  }, repeat);
}
function brushedMetal(l = 70) {
  return pbrSet(256, (c, h, r, s) => {
    c.fillStyle = hsl(210, 4, l); c.fillRect(0, 0, s, s); h.fillStyle = '#808080'; h.fillRect(0, 0, s, s); r.fillStyle = '#6a6a6a'; r.fillRect(0, 0, s, s);
    for (let i = 0; i < 900; i++) { const y = rnd() * s; c.fillStyle = hsl(210, 4, l + R(-10, 10), .25); c.fillRect(0, y, s, R(.3, 1));
      r.fillStyle = `rgba(${R(60, 140)|0},${R(60, 140)|0},${R(60, 140)|0},.3)`; r.fillRect(0, y, s, 1); }
  }, [1, 1]);
}
const std = (o) => new THREE.MeshStandardMaterial(o);
function pbrMat(set, extra = {}) { return std({ map: set.map, bumpMap: set.bumpMap, roughnessMap: set.roughnessMap, bumpScale: 0.6, roughness: 1, ...extra }); }

/* ============================== MATERIALS ============================== */
const M = {
  floor: pbrMat(concrete(78, [8, 6]), { bumpScale: .3 }),
  slabEdge: pbrMat(concrete(88, [10, 1]), { bumpScale: .2 }),
  oak: pbrMat(woodPlanks(32, 42, 58, 6, [5, 4])),
  deck: pbrMat(woodPlanks(22, 48, 34, 7, [5, 4])),
  deskTop: pbrMat(woodPlanks(34, 30, 72, 4, [1, 1]), { bumpScale: .25 }),
  walnut: pbrMat(woodPlanks(24, 40, 30, 4, [1, 1]), { bumpScale: .25 }),
  carpetEng: pbrMat(carpet(215, 14, 28, [6, 3])),
  carpetMeet: pbrMat(carpet(200, 22, 36, [4, 3])),
  rubber: pbrMat(carpet(220, 8, 18, [4, 2]), { bumpScale: .3 }),
  tiles: pbrMat(tiles([4, 3]), { bumpScale: .5 }),
  metal: pbrMat(brushedMetal(66), { metalness: .85, roughness: .45, bumpScale: .05 }),
  blackMetal: std({ color: '#1d2129', metalness: .6, roughness: .5 }),
  plastic: std({ color: '#22262e', roughness: .55 }),
  white: std({ color: '#eceae4', roughness: .6 }),
  stone: pbrMat(concrete(90, [2, 1]), { bumpScale: .15, roughness: .35 }),
  glass: new THREE.MeshPhysicalMaterial({ color: '#cfe6ff', roughness: .05, metalness: 0, transparent: true, opacity: .16, depthWrite: false, side: THREE.DoubleSide }),
  potWhite: std({ color: '#efece6', roughness: .7 }),
  potClay: std({ color: '#b86b46', roughness: .85 }),
  soil: std({ color: '#3a2a1e', roughness: 1 }),
  leaf: [std({ color: '#3f7f3a', roughness: .65, side: THREE.DoubleSide }), std({ color: '#2f6b33', roughness: .65, side: THREE.DoubleSide }), std({ color: '#5b9447', roughness: .65, side: THREE.DoubleSide })],
  cushionOrange: pbrMat(fabric(22, 62, 50)), cushionGrey: pbrMat(fabric(210, 8, 46)), cushionCream: pbrMat(fabric(40, 25, 82)),

function pose(p, mode, t) {
  const P = p.parts;
  if (mode === 'sit' || mode === 'type') {
    P.hips.position.y = .56; P.lLeg.hip.rotation.x = P.rLeg.hip.rotation.x = -Math.PI / 2; P.lLeg.knee.rotation.x = P.rLeg.knee.rotation.x = Math.PI / 2;
    const k = mode === 'type' ? Math.sin(t * 14) * .06 : 0;
    P.lArm.rotation.x = -1.05 + k; P.rArm.rotation.x = -1.05 - k; P.lArm.rotation.z = .12; P.rArm.rotation.z = -.12;
    P.head.rotation.x = mode === 'type' ? .08 + Math.sin(t * 2) * .03 : Math.sin(t * .8) * .05; P.head.rotation.y = mode === 'sit' ? Math.sin(t * .5) * .3 : 0;
    P.hips.position.y += Math.sin(t * 2) * .004;
  } else if (mode === 'walk') {
    const s = Math.sin(t * 9); P.hips.position.y = .86 + Math.abs(Math.cos(t * 9)) * .03;
    P.lLeg.hip.rotation.x = s * .5; P.rLeg.hip.rotation.x = -s * .5; P.lLeg.knee.rotation.x = Math.max(0, -s) * .6; P.rLeg.knee.rotation.x = Math.max(0, s) * .6;
    P.lArm.rotation.x = -s * .45; P.rArm.rotation.x = P.paper.visible ? -.9 : s * .45; P.lArm.rotation.z = .06; P.rArm.rotation.z = -.06; P.head.rotation.set(0, 0, 0);
  } else { // stand / talk
    P.hips.position.y = .86; P.lLeg.hip.rotation.x = P.rLeg.hip.rotation.x = 0; P.lLeg.knee.rotation.x = P.rLeg.knee.rotation.x = 0;
    P.lArm.rotation.x = 0; P.rArm.rotation.x = -.5 + Math.sin(t * 3) * .15; P.lArm.rotation.z = .08; P.rArm.rotation.z = -.08; P.head.rotation.x = Math.sin(t * 4) * .05;
  }
}

const BACK_LANE = 8.25; // walkway behind the second desk row
const laneFor = (z1, z2) => (z1 > 6 && z2 > 6) ? BACK_LANE : AISLE_Z;
function routeTo(id, dest, after) {
  const o = agentObjs[id], side = o.front, L = laneFor(side.z, dest.z);
  o.path = [side.clone(), new THREE.Vector3(side.x, 0, L), new THREE.Vector3(dest.x, 0, L), dest.clone()]; o.after = after; o.mode = 'walk';
}
function routeHome(id, after) {
  const o = agentObjs[id], cur = o.p.root.position.clone(), L = laneFor(cur.z, o.front.z);
  o.path = [new THREE.Vector3(cur.x, 0, L), new THREE.Vector3(o.front.x, 0, L), o.front.clone(), o.seat.clone()];
  o.after = () => { o.p.root.rotation.y = o.seatRot; o.mode = o.status === 'working' ? 'type' : 'sit'; after && after(); };
}
const wait = ms => new Promise(r => setTimeout(r, ms));
// Safety net: if the tab is hidden (no animation frames), finish the walk after its expected time
function guard(id, resolve) {
  const o = agentObjs[id]; let len = 0, prev = o.p.root.position.clone();
  (o.path || []).forEach(pt => { len += prev.distanceTo(pt); prev = pt; });
  const t = setTimeout(() => { if (!o.path) return; const last = o.path[o.path.length - 1]; o.p.root.position.copy(last); o.path = null;
    const f = o.after; o.after = null; o.mode = 'stand'; f && f(); }, len / 1.7 * 1000 + 2500);

}
const walk = (id, dest) => new Promise(r => { routeTo(id, dest, null); agentObjs[id].after = guard(id, r); });

function createOpty(v) {
  const text = v.replace(/^(ada\s+)?(opty|prospek|peluang)(\s+baru)?\s*:?\s*/i, '');
  const cm = text.match(/\b(PT|CV|RS|PD|UD|Bank|Dinas)\.?\s+[A-Z][\w&.]*(?:\s+[A-Z][\w&.]*)*/);
  const vm = text.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|miliar|m)\b/i);
  const name = (cm ? text.replace(cm[0], '') : text).replace(/,?\s*(perkiraan|nilai|sekitar|estimasi)?\s*(rp\.?\s*)?\d+(?:[.,]\d+)?\s*(jt|juta|miliar|m)\b/i, '').replace(/[,–-]\s*(?=,|$)/g, '').replace(/\s*[,–-]\s*$/, '').trim() || text;
  OPTY.unshift({ name: name.slice(0, 60), client: cm ? cm[0] : '–', stage: 'Lead', value: vm ? `Rp ${vm[1]} ${/^m|miliar/i.test(vm[2]) ? 'M' : 'jt'}` : '–', days: 0 });
  logFeed('Nadia', `opty dibuat: ${OPTY[0].name}`); if (selected === 'crm') renderDetail();
}

  S[from].p.parts.paper.visible = false; say(from, text); await wait(1500); await home(from);
}

  setStatus('pm', 'idle'); agentObjs.pm.a.task = ''; T.task = v; setStatus(to, 'working'); say(to, 'Siap, saya kerjakan!');
  if (to === 'crm') {

    await handoff('crm', 'sa', 'Mas Fajar, tolong bedah opty baru ini ya.'); setStatus('crm', 'idle'); agentObjs.crm.a.task = '';
    agentObjs.sa.a.task = 'Bedah opty: ' + v; setStatus('sa', 'working'); say('sa', 'Siap, saya bedah kebutuhan & solusinya.'); logFeed('Fajar', 'mulai membedah opty'); await wait(2600);

}
async function delegate(v) {

  const map = { Nadia: 'crm', Fajar: 'sa', Budi: 'rab', Rina: 'inv', Dewi: 'fin', Raka: 'prog', Adit: 'ops' };

/* ============================== LOOP ============================== */
const clock = new THREE.Clock();
let fpsN = 0, fpsT = 0; const fpsEl = document.getElementById('fps');
function frame() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, .05), t = clock.elapsedTime;
  fpsN++; fpsT += rawDt; if (fpsT > 1) { fpsEl.textContent = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  // camera tween
  if (camTween) { camTween.t = Math.min(1, camTween.t + dt * 1.4); const k = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k); controls.target.lerpVectors(camTween.fromT, camTween.toT, k); if (camTween.t >= 1) camTween = null; }
  controls.update();
  // agents
  for (const id in agentObjs) { const o = agentObjs[id];
    if (o.path) { const target = o.path[0], pos = o.p.root.position; tmpV.subVectors(target, pos); tmpV.y = 0; const d = tmpV.length();
      if (d < .05) { o.path.shift(); if (!o.path.length) { o.path = null; const f = o.after; o.after = null; o.mode = 'stand'; f && f(); } }
      else { const step = Math.min(d, Math.min(rawDt, .6) * 1.7); pos.addScaledVector(tmpV.normalize(), step); const want = Math.atan2(tmpV.x, tmpV.z);
        let diff = want - o.p.root.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); o.p.root.rotation.y += diff * Math.min(1, rawDt * 10); } }
    pose(o.p, o.mode, t + id.length);
    o.ringMat.opacity = .45 + .35 * (o.status === 'working' || o.status === 'waiting' ? (Math.sin(t * 4) + 1) / 2 : .3);
    o.ring.scale.setScalar(o.status === 'waiting' ? 1 + .06 * Math.sin(t * 6) : 1); }
  fires.forEach((f, i) => { f.scale.y = .8 + .35 * Math.sin(t * 12 + i * 1.7); f.position.y = .5 + .03 * Math.sin(t * 9 + i); });
  fireLight.intensity = (night ? 2.2 : .6) + .3 * Math.sin(t * 17);
  rackFace.emissiveIntensity = .7 + .3 * Math.sin(t * 6);
  // day / night blend
  const n = night ? 1 : 0; dayNight += (n - dayNight) * Math.min(1, dt * 2.5);
  scene.background.lerpColors(BG_DAY, BG_NIGHT, dayNight);
  hemi.intensity = .9 - .65 * dayNight; sun.intensity = 2.2 - 1.9 * dayNight; scene.environmentIntensity = .55 - .35 * dayNight;
  lamps.forEach(l => { if (l.isPointLight) l.intensity = 1.2 + 5 * dayNight; else l.emissiveIntensity = .5 + 1.6 * dayNight; });
  screens.forEach(s => s.emissiveIntensity = .85 + .5 * dayNight);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
let dayNight = 0;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });
/* ---- merge static meshes by material: thousands of draw calls -> a few dozen ---- */
function mergeStatic() {
  scene.updateMatrixWorld(true);
  const buckets = new Map(), victims = [];
  scene.traverse(o => {
    if (!o.isMesh || Array.isArray(o.material) || o.material.visible === false) return;
    for (let q = o; q; q = q.parent) if (q.userData.dynamic) return;
    const key = o.material.uuid + '|' + (+o.castShadow) + (+o.receiveShadow);
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv || !g.attributes.normal) return;
    g.clearGroups(); g.applyMatrix4(o.matrixWorld);
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, geos: [] });
    buckets.get(key).geos.push(g); victims.push(o);
  });
  victims.forEach(o => o.parent.remove(o));
  let n = 0;
  buckets.forEach(b => { const merged = mergeGeometries(b.geos, false); if (!merged) return; const m = new THREE.Mesh(merged, b.mat);
    m.castShadow = b.cast; m.receiveShadow = b.recv; m.matrixAutoUpdate = false; scene.add(m); n++; });
  return [victims.length, n];
}
const [before, after] = mergeStatic();
console.log(`[kantor] merged ${before} meshes into ${after} draw calls`);
renderTeam(); renderInbox(); logFeed('Sistem', `kantor dibuka · ${AGENTS.length} agent online`); if (QUESTIONS.length) logFeed('Sistem', `${QUESTIONS.length} pertanyaan dari tim menunggu jawaban`);
function staleReminder() { if (demoRunning) return; const st = OPTY.filter(o => o.days > STALE_DAYS); if (!st.length) return;
  const o = st[(Math.random() * st.length) | 0]; setStatus('crm', 'waiting');
  say('crm', `⚠ Opty "${o.name}" (${o.client}) belum di-update ${o.days} hari. Mau saya follow up?`, 5000); logFeed('Nadia', `pengingat: ${o.client} ${o.days} hari tanpa update`); }
setTimeout(staleReminder, 4000); setInterval(staleReminder, 45000);
frame();
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 600);
